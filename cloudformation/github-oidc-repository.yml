Parameters:
  GitHubRepository:
    Type: String
    AllowedPattern: ^[A-Za-z0-9-]+/[A-Za-z0-9_.-]{1,51}$
    ConstraintDescription: Must be OWNER/REPOSITORY using letters, numbers, hyphens, underscores, and periods.
    Description: GitHub repository in OWNER/REPOSITORY format, for example octo-org/example-repo.
  CdkDeployGitHubWorkflow:
    Type: String
    Default: cdk-deploy
    Description: "Workflow name allowed to assume the CDK deployment role when GitHubEnvironment is empty. Use the name: field, not the file name."
  GitHubEnvironment:
    Type: String
    Default: ""
    AllowedPattern: ^[A-Za-z0-9._-]*$
    ConstraintDescription: Use letters, numbers, hyphens, underscores, and periods, or leave empty.
    Description: GitHub Environment name. When set, only jobs using this environment can assume the role. When empty, the workflow and main branch are used instead.
  CdkBootstrapQualifier:
    Type: String
    Default: hnb659fds
    AllowedPattern: ^[A-Za-z0-9]{1,10}$
    ConstraintDescription: Must be 1 to 10 letters or numbers.
    Description: Qualifier used by cdk bootstrap. Must match the --qualifier value used for the target account.
Conditions:
  HasGitHubEnvironment:
    Fn::Not:
      - Fn::Equals:
          - Ref: GitHubEnvironment
          - ""
Resources:
  GitHubCdkDeployRole5F595E0B:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  Fn::If:
                    - HasGitHubEnvironment
                    - Fn::Join:
                        - ""
                        - - "repo:"
                          - Ref: GitHubRepository
                          - ":environment:"
                          - Ref: GitHubEnvironment
                    - Fn::Join:
                        - ""
                        - - "repo:"
                          - Ref: GitHubRepository
                          - ":workflow:"
                          - Ref: CdkDeployGitHubWorkflow
                          - :ref:refs/heads/main
            Effect: Allow
            Principal:
              Federated:
                Fn::Join:
                  - ""
                  - - "arn:"
                    - Ref: AWS::Partition
                    - ":iam::"
                    - Ref: AWS::AccountId
                    - :oidc-provider/token.actions.githubusercontent.com
        Version: "2012-10-17"
      Policies:
        - PolicyDocument:
            Statement:
              - Action: sts:AssumeRole
                Effect: Allow
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":iam::"
                      - Ref: AWS::AccountId
                      - :role/cdk-
                      - Ref: CdkBootstrapQualifier
                      - -*
                Sid: AssumeCdkBootstrapRoles
              - Action: ssm:GetParameter
                Effect: Allow
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":ssm:"
                      - Ref: AWS::Region
                      - ":"
                      - Ref: AWS::AccountId
                      - :parameter/cdk-bootstrap/
                      - Ref: CdkBootstrapQualifier
                      - /version
                Sid: ReadCdkBootstrapVersion
            Version: "2012-10-17"
          PolicyName: CdkDeployAccess
        - PolicyDocument:
            Statement:
              - Action: cloudformation:ValidateTemplate
                Effect: Allow
                Resource: "*"
                Sid: ValidateCloudFormationTemplate
              - Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Effect: Allow
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":cloudformation:"
                      - Ref: AWS::Region
                      - ":"
                      - Ref: AWS::AccountId
                      - :stack/CDKToolkit/*
                Sid: ManageCdkToolkitStack
              - Action:
                  - iam:CreateRole
                  - iam:GetRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Effect: Allow
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":iam::"
                      - Ref: AWS::AccountId
                      - :role/cdk-
                      - Ref: CdkBootstrapQualifier
                      - -*
                Sid: ManageCdkIamRoles
              - Action:
                  - s3:CreateBucket
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetLifecycleConfiguration
                  - s3:PutLifecycleConfiguration
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                Effect: Allow
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - :s3:::cdk-
                      - Ref: CdkBootstrapQualifier
                      - -assets-
                      - Ref: AWS::AccountId
                      - -*
                Sid: ManageCdkAssetBucket
              - Action:
                  - ecr:CreateRepository
                  - ecr:DescribeRepositories
                  - ecr:GetRepositoryPolicy
                  - ecr:SetRepositoryPolicy
                  - ecr:GetLifecyclePolicy
                  - ecr:PutLifecyclePolicy
                  - ecr:PutImageScanningConfiguration
                  - ecr:PutImageTagMutability
                  - ecr:ListTagsForResource
                  - ecr:TagResource
                Effect: Allow
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":ecr:"
                      - Ref: AWS::Region
                      - ":"
                      - Ref: AWS::AccountId
                      - :repository/cdk-
                      - Ref: CdkBootstrapQualifier
                      - -container-assets-
                      - Ref: AWS::AccountId
                      - -*
                Sid: ManageCdkContainerRepository
              - Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                  - ssm:AddTagsToResource
                Effect: Allow
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":ssm:"
                      - Ref: AWS::Region
                      - ":"
                      - Ref: AWS::AccountId
                      - :parameter/cdk-bootstrap/
                      - Ref: CdkBootstrapQualifier
                      - /version
                Sid: ManageCdkVersionParameter
            Version: "2012-10-17"
          PolicyName: CdkBootstrapAccess
      RoleName:
        Fn::Join:
          - "-"
          - - GHACdkDeploy
            - Fn::Select:
                - 1
                - Fn::Split:
                    - /
                    - Ref: GitHubRepository
    Metadata:
      aws:cdk:path: GitHubOidcRepositoryStack/GitHubCdkDeployRole/Resource
  CDKMetadata:
    Type: AWS::CDK::Metadata
    Properties:
      Analytics: v2:deflate64:H4sIAAAAAAAA/yWJQQ6CMBAA38K9XbFEfQAP0OADzELXZIFuTbuVA+HvpvE0MxkH7naBtsEt28kvduUR9qfitJj+LQ9MGEgp1eijeFaOYnDLL8YA+xBXqqvyqHIv+il6GImeYM6nr7vCuYO2mTOzTUWUA8Hw5w/sWR0lfAAAAA==
    Metadata:
      aws:cdk:path: GitHubOidcRepositoryStack/CDKMetadata/Default
Outputs:
  GHACdkDeployRoleArn:
    Value:
      Fn::GetAtt:
        - GitHubCdkDeployRole5F595E0B
        - Arn

