Parameters:
  GitHubRepository:
    Type: String
    AllowedPattern: ^[A-Za-z0-9-]+/[A-Za-z0-9_.-]{1,41}$
    ConstraintDescription: Must be OWNER/REPOSITORY using letters, numbers, hyphens, underscores, and periods.
    Description: GitHub repository in OWNER/REPOSITORY format, for example octo-org/example-repo.
  GitHubCdkDeployWorkflow:
    Type: String
    Default: cdk-deploy
    Description: "Workflow name allowed to assume the CDK deployment role. Use the name: field, not the file name."
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      ClientIdList:
        - sts.amazonaws.com
      Url: https://token.actions.githubusercontent.com
    Metadata:
      aws:cdk:path: GitHubOidcStack/GitHubOidcProvider
  GitHubCdkDeployRole5F595E0B:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  Fn::Join:
                    - ""
                    - - "repo:"
                      - Ref: GitHubRepository
                      - ":workflow:"
                      - Ref: GitHubCdkDeployWorkflow
                      - :ref:refs/heads/main
            Effect: Allow
            Principal:
              Federated:
                Fn::GetAtt:
                  - GitHubOidcProvider
                  - Arn
        Version: "2012-10-17"
      Policies:
        - PolicyDocument:
            Statement:
              - Action: sts:AssumeRole
                Effect: Allow
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":iam::"
                      - Ref: AWS::AccountId
                      - :role/cdk-hnb659fds-*
              - Action: ssm:GetParameter
                Effect: Allow
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":ssm:"
                      - Ref: AWS::Region
                      - ":"
                      - Ref: AWS::AccountId
                      - :parameter/cdk-bootstrap/hnb659fds/version
            Version: "2012-10-17"
          PolicyName: CdkBootstrapAccess
      RoleName:
        Fn::Join:
          - "-"
          - - GitHubActionsCdkDeploy
            - Fn::Select:
                - 1
                - Fn::Split:
                    - /
                    - Ref: GitHubRepository
    Metadata:
      aws:cdk:path: GitHubOidcStack/GitHubCdkDeployRole/Resource
  CDKMetadata:
    Type: AWS::CDK::Metadata
    Properties:
      Analytics: v2:deflate64:H4sIAAAAAAAA/yXKTQ6CMBBA4bOwb0csUQ9QN64geAAy0iEZoK3pDywIdzeNq+8tngL1uEFd4R7laBa58geOd8JxEXpyHQa0lCgI3OPAaOHQk2tfT90Fv7GhIHq/UlmLZ4k2p29Op3DeEMzxsqk7XBuoqzkyy5BdYkvQ//0BithiBX8AAAA=
    Metadata:
      aws:cdk:path: GitHubOidcStack/CDKMetadata/Default
Outputs:
  GitHubCdkDeployRoleArn:
    Value:
      Fn::GetAtt:
        - GitHubCdkDeployRole5F595E0B
        - Arn

