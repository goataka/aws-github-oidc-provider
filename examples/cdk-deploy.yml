name: cdk-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: "123456789012" # 変更：AWS アカウントID
  AWS_REGION: ap-northeast-1 # 変更：デプロイ先のリージョン
  REPOSITORY_NAME: example-repo # 変更：リポジトリ名（ロール名に使用）
  CDK_BOOTSTRAP_QUALIFIER: hnb659fds # 変更：cdk bootstrap の修飾子

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assume CDK deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GHACdkDeploy-${{ env.REPOSITORY_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap CDK (first run only)
        run: pnpm exec cdk bootstrap --qualifier "$CDK_BOOTSTRAP_QUALIFIER"

      - name: Deploy
        run: pnpm exec cdk deploy --all --require-approval never
