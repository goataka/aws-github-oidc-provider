name: Update pull request CloudFormation template

on:
  workflow_run:
    workflows: ["Verify CloudFormation template"]
    types: [completed]

permissions:
  actions: write
  contents: write

jobs:
  update-template:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (
        (
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.pull_requests[0].head.repo.full_name == github.repository
        ) ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch != github.event.repository.default_branch &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    concurrency:
      group: template-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download synthesized template
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudformation-template
          path: generated
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check out source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: >-
            ${{ github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.pull_requests[0].head.sha ||
            github.event.workflow_run.head_sha }}
          path: source

      - name: Commit updated CloudFormation template
        id: commit-template
        env:
          SOURCE_BRANCH: >-
            ${{ github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.pull_requests[0].head.ref ||
            github.event.workflow_run.head_branch }}
        run: >-
          bash .github/scripts/update-template.sh
          "${SOURCE_BRANCH}"
          generated/GitHubOidcStack.template.json
          source
          "${GITHUB_OUTPUT}"

      - name: Rerun validation for updated branch
        if: steps.commit-template.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BRANCH: >-
            ${{ github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.pull_requests[0].head.ref ||
            github.event.workflow_run.head_branch }}
        run: gh workflow run synth.yml --ref "${SOURCE_BRANCH}"
