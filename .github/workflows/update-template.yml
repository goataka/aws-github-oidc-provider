name: Update pull request CloudFormation template

on:
  workflow_run:
    workflows: ["Verify CloudFormation template"]
    types: [completed]

permissions:
  actions: write
  contents: write

jobs:
  update-template:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (
        (
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.pull_requests[0].head.repo.full_name == github.repository
        ) ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch != github.event.repository.default_branch &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    concurrency:
      group: template-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Download synthesized template
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudformation-template
          path: generated
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check out source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Commit updated CloudFormation template
        env:
          SOURCE_BRANCH: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].head.ref || github.event.workflow_run.head_branch }}
        run: |
          jq -e '
            .Resources | type == "object" and
            has("GitHubOidcProvider") and
            ([to_entries[] | select(.value.Type == "AWS::IAM::Role")] | length == 2)
          ' generated/GitHubOidcStack.template.json >/dev/null
          cp generated/GitHubOidcStack.template.json template.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- template.json
          if git diff --cached --quiet -- template.json; then
            echo "CloudFormation template is already current."
            exit 0
          fi
          git commit -m "Update synthesized CloudFormation template"
          git push origin "HEAD:refs/heads/${SOURCE_BRANCH}"
          gh workflow run synth.yml --ref "${SOURCE_BRANCH}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
