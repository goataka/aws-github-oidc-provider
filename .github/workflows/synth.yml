name: Verify CloudFormation template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Synthesize CloudFormation template
        run: pnpm synth

      - name: Check generated template and show differences
        run: git diff -- template.json

      - name: Upload synthesized template
        if: always() && hashFiles('cdk.out/GitHubOidcStack.template.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudformation-template
          path: cdk.out/GitHubOidcStack.template.json
          if-no-files-found: error
