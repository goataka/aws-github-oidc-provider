name: Verify CloudFormation template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudformation-template-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Synthesize CloudFormation template
        run: pnpm synth

      - name: Validate generated template
        run: |
          jq -e '
            .Resources | type == "object" and
            has("GitHubOidcProvider") and
            ([to_entries[] | select(.value.Type == "AWS::IAM::Role")] | length == 1)
          ' template.json >/dev/null

      - name: Detect template changes
        id: template
        run: |
          if git diff --quiet -- template.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- template.json
          fi

      - name: Commit updated template
        if: >-
          steps.template.outputs.changed == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
          (github.event.pull_request.head.ref || github.ref_name) != github.event.repository.default_branch
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- template.json
          git commit -m "Update synthesized CloudFormation template"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:refs/heads/${SOURCE_BRANCH}"

      - name: Report template drift without commit
        if: >-
          steps.template.outputs.changed == 'true' &&
          !(
            (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
            (github.event.pull_request.head.ref || github.ref_name) != github.event.repository.default_branch
          )
        run: |
          echo "::warning::template.json is out of date. Run pnpm synth on this branch and commit the result."
