name: Verify CloudFormation template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.0

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Synthesize CloudFormation template
        run: pnpm synth

      - name: Check generated template and show differences
        run: git diff -- template.json

      - name: Upload synthesized template
        if: always() && hashFiles('cdk.out/GitHubOidcStack.template.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudformation-template
          path: cdk.out/GitHubOidcStack.template.json
          if-no-files-found: error
